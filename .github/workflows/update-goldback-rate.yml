name: Update Official Goldback Rate

on:
  schedule:
    # Goldback says its official daily rate updates at 10:00 AM MST (17:00 UTC).
    # Run 15 minutes later to give the official site time to publish the new rate.
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Read official Goldback daily exchange rate
        run: |
          cat > /tmp/read-rate.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage();
          await page.goto('https://www.goldback.com/exchange-rates/', {
            waitUntil: 'domcontentloaded',
            timeout: 60000
          });
          await page.waitForTimeout(5000);

          const body = await page.locator('body').innerText();
          await browser.close();

          // Goldback's page labels the value with "1 GOLDBACK DAILY EXCHANGE RATE".
          // Capture the first dollar amount immediately associated with that section.
          const section = body.match(/1\s*GOLDBACK[\s\S]{0,500}/i)?.[0] ?? '';
          const matches = [...section.matchAll(/\$\s*([0-9]+(?:\.[0-9]{1,2})?)/g)];
          const value = matches.length ? Number(matches[0][1]) : NaN;

          if (!Number.isFinite(value) || value <= 0 || value > 1000) {
            console.error('Could not read the official Goldback rate. Section text:');
            console.error(section);
            process.exit(1);
          }

          const today = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'America/Denver',
            year: 'numeric', month: '2-digit', day: '2-digit'
          }).format(new Date());

          const now = new Date().toISOString();
          const rate = {
            goldback_usd: Math.round(value * 100) / 100,
            rate_date: today,
            source: 'Goldback Inc. official daily exchange rate',
            updated_utc: now
          };

          fs.writeFileSync('rate.json', JSON.stringify(rate, null, 2) + '\n');

          let history = [];
          try { history = JSON.parse(fs.readFileSync('rate-history.json', 'utf8')); } catch {}
          history = history.filter(x => x.date !== today);
          history.push({date: today, value: rate.goldback_usd});
          history.sort((a,b) => a.date.localeCompare(b.date));
          // Keep the last 365 published rates.
          history = history.slice(-365);
          fs.writeFileSync('rate-history.json', JSON.stringify(history, null, 2) + '\n');

          console.log(JSON.stringify(rate, null, 2));
          JS
          node /tmp/read-rate.mjs

      - name: Commit updated rate
        run: |
          git config user.name "Entensylvania Treasury Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json rate-history.json
          git diff --cached --quiet && echo "Rate unchanged; nothing to commit." && exit 0
          git commit -m "Update official Goldback daily rate"
          git push
