name: Update Official Goldback Rate

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Read official Goldback daily exchange rate
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({
              viewport: { width: 1440, height: 1200 },
              userAgent: 'Entensylvania-Treasury-Rate-Updater/1.0'
            });

            try {
              await page.goto('https://www.goldback.com/calculator/', {
                waitUntil: 'networkidle',
                timeout: 90000
              });
              await page.waitForTimeout(5000);

              const bodyText = await page.locator('body').innerText();
              const candidates = [];

              const patterns = [
                /1\s*=\s*\$\s*([0-9]+(?:,[0-9]{3})*(?:\.[0-9]{2}))/g,
                /1\s*GOLDBACK[\s\S]{0,250}?\$\s*([0-9]+(?:,[0-9]{3})*(?:\.[0-9]{2}))/gi,
                /DAILY EXCHANGE RATE[\s\S]{0,500}?\$\s*([0-9]+(?:,[0-9]{3})*(?:\.[0-9]{2}))/gi
              ];

              for (const re of patterns) {
                let m;
                while ((m = re.exec(bodyText)) !== null) {
                  candidates.push(Number(m[1].replace(/,/g, '')));
                }
              }

              const value = candidates.find(v => Number.isFinite(v) && v >= 1 && v <= 100);

              if (!value) {
                console.error('Could not find the rendered Goldback daily rate.');
                console.error(bodyText.slice(0, 12000));
                process.exit(1);
              }

              const today = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Denver',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).format(new Date());

              let history = [];
              if (fs.existsSync('rate-history.json')) {
                try { history = JSON.parse(fs.readFileSync('rate-history.json', 'utf8')); }
                catch (_) {}
              }

              history = Array.isArray(history) ? history : [];
              history = history.filter(x => x && x.date !== today);
              history.push({ date: today, value: Number(value.toFixed(2)) });
              history.sort((a,b) => String(a.date).localeCompare(String(b.date)));
              history = history.slice(-365);

              fs.writeFileSync(
                'rate.json',
                JSON.stringify({
                  goldback_usd: Number(value.toFixed(2)),
                  rate_date: today,
                  source: 'Goldback Inc. official daily exchange rate',
                  updated_utc: new Date().toISOString()
                }, null, 2) + '\n'
              );

              fs.writeFileSync('rate-history.json', JSON.stringify(history, null, 2) + '\n');
              console.log(`Official Goldback rate: $${value.toFixed(2)}`);
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Commit updated rate
        run: |
          git config user.name "Entensylvania Treasury Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rate.json rate-history.json
          if git diff --cached --quiet; then
            echo "No rate change today."
            exit 0
          fi
          git commit -m "Update official Goldback daily rate"
          git push
